# wrknv configuration for pyvider

[project]
name = "pyvider"
description = "Python framework for building Terraform providers"

[tools]
uv = "latest"

[siblings]
patterns = [
    "pyvider-components",  # Component library
    "pyvider-cty",        # CTY type system
    "pyvider-hcl",        # HCL parsing
    "pyvider-rpcplugin",  # RPC plugin framework
    "pyvider-telemetry",  # Telemetry system
    "wrknv",              # Environment manager
]

[settings]
python_version = ">=3.11"