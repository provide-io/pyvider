# Inherit shared configuration from provide-foundry
INHERIT: .provide/foundry/base-mkdocs.yml

# Project-Specific Configuration
site_name: pyvider
site_description: 'Python framework for building Terraform providers'
site_author: provide.io
site_url: https://pyvider.com/docs/
repo_url: https://github.com/provide-io/pyvider
repo_name: pyvider
edit_uri: edit/main/docs/
copyright: ©2024-2025 provide.io llc

# Development server configuration
dev_addr: 127.0.0.1:11004

# Standalone mode settings
docs_dir: docs

# Project-specific theme overrides
theme:
  custom_dir: docs/overrides
  homepage: https://pyvider.com
  # Override features to disable navigation.instant (causes layout shift when
  # swapping tabs via AJAX — our book icon is re-injected each time)
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    # Dark mode default — matches pyvider.com marketing site
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode alternate
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

# Project-specific plugins (in addition to base plugins)
plugins:
  - gen-files:
      scripts:
        - .provide/foundry/gen_ref_pages.py
  - literate-nav:

# Enable version detection hook
hooks:
  - .provide/foundry/theme/hooks/global_partials_hook.py
  - .provide/foundry/theme/hooks/version_hook.py

