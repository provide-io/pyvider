# MkDocs Configuration
# For a full reference, see https://www.mkdocs.org/user-guide/configuration/
# For Material theme options, see https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/

site_name: PyVider Documentation
site_description: 'Python framework for building Terraform providers'
site_author: provide.io
site_url: https://foundry.provide.io/pyvider/

repo_url: https://github.com/provide-io/pyvider
repo_name: provide-io/pyvider
edit_uri: edit/main/docs/

# Development server configuration
dev_addr: '127.0.0.1:8003'

# Standalone mode settings
docs_dir: docs

# Copyright
copyright: 'Copyright &copy; 2017 - 2025 Provide'

# Theme Configuration
theme:
  name: material
  logo: assets/logo.svg # You may need to create this file
  favicon: assets/favicon.ico # You may need to create this file
  language: en

  # Features for a top-tier experience
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - toc.integrate  # Move TOC to the left sidebar
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link

  # Color Palette (with light/dark mode toggle)
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Plugins
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            show_bases: true
            merge_init_into_class: true
            separate_signature: true

# Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

