[project]
name = "terraform-provider-demo"
version = "1.0.0"
description = "Demo Terraform Provider built with Pyvider - Testing s_function"
requires-python = ">=3.11"
dependencies = [
    "pyvider>=0.3.33",
]

[project.scripts]
terraform-provider-demo = "demo:main"

[project.entry-points."pyvider"]
demo = "demo"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["demo"]

[tool.pyvider]
provider_name = "demo"
