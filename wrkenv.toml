[workenv]
# Configuration for wrkenv in the pyvider project

[workenv.env]
# Configure sibling package installation
sibling_patterns = ["pyvider-*"]

[[workenv.env.special_siblings]]
name = "tofusoup"
var_name = "tofusoup"
with_deps = false

[[workenv.env.special_siblings]]
name = "flavor"
var_name = "flavor"
with_deps = false

[[workenv.env.special_siblings]]
name = "wrkenv"
var_name = "wrkenv"
with_deps = false

[workenv.tools]
# Tool versions can be specified here if needed
# ibmtf = "1.8.5"
# tofu = "1.10.5"