#
# pyvider/pyproject.toml
#
# Python Terraform Provider Framework
#

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvider"
description = "Python Terraform Provider Framework"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
keywords = ["terraform", "provider", "framework", "opentofu", "grpc", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=25.4.0",
    "click>=8.3.1",
    # Floors are set by the committed protobuf stubs, which enforce them at
    # import: tfplugin6_pb2_grpc.py pins GRPC_GENERATED_VERSION = '1.83.0' and
    # raises RuntimeError below it, and tfplugin6_pb2.py calls
    # ValidateProtobufRuntimeVersion(..., 7, 35, 1, ...). Raise these together
    # with the stubs, never independently.
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "msgpack>=1.1.1",
    "google>=3.0.0",
    "cryptography>=45.0.7",
    "provide-foundation>=0.4.0",
    "pyvider-cty>=0.5.2",
    # 0.4.2 raises the gRPC server's message limits from the 4 MB default to
    # Terraform's 256 MB. A state store negotiates 8 MB chunks, so on anything
    # older every chunk of a multi-chunk write is refused before it arrives.
    "pyvider-rpcplugin>=0.4.2",
]

[project.urls]
Homepage = "https://pyvider.com/docs/"
Documentation = "https://pyvider.com/docs/"
Repository = "https://github.com/provide-io/pyvider"
Issues = "https://github.com/provide-io/pyvider/issues"

[dependency-groups]
dev = [
    "provide-testkit[pyvider-dev]>=0.4.0",
    # Floor only. scripts/regen_protobuf.py --check compares stub content with
    # toolchain version stamps masked, and checks those stamps separately against
    # the grpcio/protobuf floors declared above, so a newer grpcio-tools no longer
    # reports the stubs as stale over banner churn.
    "grpcio-tools>=1.83.0",
]
docs = [
    "provide-testkit[docs]>=0.4.0",
]

[project.scripts]
pyvider = "pyvider.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "memray: memory profiling stress tests (run with -m memray)",
]
norecursedirs = [
    ".git",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "htmlcov",
    ".hypothesis",
    "mutants",
    "tests/memray",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
addopts = "-m 'not memray' --strict-markers --strict-config"
# Parallel execution: pytest -n <workers> (range: 2-16, recommend: CPU cores or 8, max: 16 to avoid xdist hang)

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
# ruff >=0.16 formats Python blocks inside Markdown; docs prose is not ours to
# restyle, so keep .md out of both check and format.
#
# `.ci-tooling` is another repository, checked out into the workspace by CI. Its
# docs are not ours to restyle either, and `ruff format .` -- which is what the
# wrknv `format.check` task runs, unlike the scoped invocation used locally --
# walks into it and fails the Code Quality job on files this repository does not
# own.
exclude = ["**/*pb2*.py", "**/*pb2*.pyi", "**/*.md", "mutants", ".ci-tooling"]

[tool.ruff.lint]
# Gates, not style. `select = ["ALL"]` was considered (#28) and rejected: it
# reports ~1900 findings here, most of them docstring and annotation policy that
# would have to be ignored wholesale, which buys nothing and hides the rules
# below. These families each catch a class of defect instead.
select = [
    "A",      # builtins shadowed by our own names
    "ANN",    # missing annotations
    "ASYNC",  # blocking calls on the event loop -- this is a gRPC server
    "B",      # bugbear
    "BLE",    # blind except
    "C4",     # comprehensions
    "C90",    # mccabe complexity
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "EXE",    # shebang/executable-bit mismatches
    "F",      # pyflakes
    "FLY",    # static str.join
    "FURB",   # refurb modernisations
    "G",      # logging call correctness
    "I",      # import sorting
    "ICN",    # import naming conventions
    "INP",    # implicit namespace packages -- a missing __init__.py ships broken
    "INT",    # gettext
    "ISC",    # implicit string concatenation, i.e. the missing-comma bug
    "LOG",    # logging module misuse
    "PERF",   # obvious performance traps
    "PGH",    # blanket noqa / blanket type: ignore
    "PIE",    # misc lints
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLR",    # pylint refactor, incl. the complexity ceilings
    "PLW",    # pylint warnings
    "PTH",    # os.path -> pathlib
    "PYI",    # stub correctness
    "Q",      # quote consistency
    "RET",    # return-path simplification
    "RSE",    # raise Foo() -> raise Foo
    "RUF",    # ruff-specific
    "S",      # bandit
    "SIM",    # simplifications
    "SLF",    # reaching into another object's privates
    "SLOT",   # __slots__ correctness
    "T10",    # leftover debugger calls
    "T20",    # print() instead of the logger
    "TID",    # banned/relative imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # sys.version checks
]
ignore = [
    "A003",     # builtin-attribute-shadowing (`type` is the domain word on a function parameter)
    "ANN401",   # any-type (too restrictive)
    "BLE001",   # blind-except (too restrictive for cleanup patterns)
    "B008",     # function-call-in-default-argument (Click uses this pattern)
    "E501",     # line-too-long (handled by formatter)
    "S101",     # assert (valid in tests)
    "S104",     # binding-to-all-interfaces (intentional for servers)
    "S105",     # hardcoded-password-string (false positive for variable names)
    "S108",     # hardcoded-temp-file (/tmp is fine for our use cases)
    "S110",     # try-except-pass (legitimate for cleanup)
    "S310",     # suspicious-url-open-for-protocol (URLs are controlled)
    "S311",     # random (not for crypto)
    "S603",     # subprocess-without-shell-equals-true (trusted input)
    "S607",     # start-process-with-partial-path (trusted executables)
    "PLR0911",  # too-many-return-statements (refactor later)
    "PLR0912",  # too-many-branches (refactor later)
    "PLR0913",  # too-many-arguments (common in config classes)
    "PLR0917",  # too-many-positional-arguments (same rationale as PLR0913)
    "PLR0915",  # too-many-statements (refactor later)
    "PLR2004",  # magic-value-comparison (too noisy)
    "PLC0415",  # import-outside-top-level (deliberate: breaks hub import cycles and keeps CLI startup cheap)
    "PLW0603",  # global-statement (module-level singletons and caches, each guarded by a lock)
]

[tool.ruff.lint.per-file-ignores]
# A test suite reaches into what it is testing (SLF001), is laid out as
# directories rather than packages (INP001), and prints and sleeps and stats
# without an event loop to protect (T201, ASYNC240, PERF401).
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ASYNC240", "B017", "C901", "E402", "INP001", "PERF401", "PGH003", "PLR0124", "PLR1714", "S102", "S105", "S106", "S110", "S307", "S311", "S324", "S602", "SIM102", "SIM105", "SIM108", "SIM117", "SLF001", "T201"]
# Snippets teach one idea each. The file examples would have to wrap every
# read and stat in asyncio.to_thread to satisfy ASYNC240, which is a lesson
# about thread pools rather than about the resource lifecycle they exist to show.
"docs/snippets/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ASYNC240", "E402", "INP001"]
# Developer and CI scripts are console programs; stdout is their interface.
"scripts/**" = ["PERF401", "T201"]
# Complex protocol handlers - inherently complex due to Terraform protocol requirements
"src/pyvider/cli/launch_context_command.py" = ["C901"]
"src/pyvider/protocols/tfprotov6/handlers/utils.py" = ["C901"]
"src/pyvider/protocols/tfprotov6/handlers/read_data_source.py" = ["C901"]
# SLF001 sees module-private access; these three reach into names their own
# package owns, which is a distinction ruff cannot draw.
"src/pyvider/cli/components_commands.py" = ["SLF001"]
"src/pyvider/functions/decorators.py" = ["SLF001"]
"src/pyvider/protocols/tfprotov6/handlers/configure_provider.py" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["pyvider", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false
disable_error_code = ["type-arg"]
exclude = ["src/pyvider/protocols/tfprotov6/protobuf/tfplugin6_pb2.py", "src/pyvider/protocols/tfprotov6/protobuf/tfplugin6_pb2.pyi", "src/pyvider/protocols/tfprotov6/protobuf/tfplugin6_pb2_grpc.py", "src/pyvider/protocols/tfprotov6/protobuf/docs/tfplugin6_pb2_grpc.py"]

[[tool.mypy.overrides]]
module = ["structlog.*", "google.*", "grpc.*", "pytest.*", "jq.*", "psutil.*", "opentelemetry.*", "pyvider.server", "provide.foundation.logging"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyvider.cty.*"]
ignore_missing_imports = true
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["pyvider.hcl.*", "hcl2", "hcl2.*"]
ignore_missing_imports = true
ignore_errors = true

# Proto-generated bindings lack .pyi stubs; protobuf populates class attrs
# dynamically at module-load time, so mypy can't see them statically.
[[tool.mypy.overrides]]
module = ["pyvider.protocols.tfprotov6.protobuf.*"]
ignore_errors = true

[tool.mutmut]
# `paths_to_mutate` was renamed to `source_paths` in mutmut 3.
# The whole package must be copied, not just the modules under test: mutmut
# runs the suite inside `mutants/`, and a partial copy leaves imports like
# `pyvider.hub` unresolvable. Narrow what actually runs with a mutant-name
# filter instead, e.g. `mutmut run "src.pyvider.state_stores.*"`.
source_paths = ["src/pyvider"]
# The runner must cover every source path above, or mutants in the newer
# packages are reported as survivors purely because nothing exercised them.
# Scope collection to the suites that exercise the mutated code. Collecting
# the whole tree pulls in tests/docs/, whose module-level pytest.skip aborts
# mutmut's stats run.
tests_dir = ["tests/tfprotov6/handlers", "tests/state_stores", "tests/list_resources", "tests/actions"]
dict_synonyms = ["dict", "OrderedDict", "defaultdict"]
use_patch_file = false

[tool.coverage.run]
source = ["pyvider"]
branch = true
parallel = true
omit = [
    "*/protocols/tfprotov6/protobuf/*",
    "*/protocols/tfprotov6/handlers/validate_resource_config.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "pass",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "workenv"]

################################################################################
# codespell
################################################################################

[tool.codespell]
skip = "docs/js/termynal.js,docs/css/termynal.css,.venv,workenv,*.lock"
ignore-words-list = "ines,nd"

################################################################################
# Security Scanning Allowlist
################################################################################

[tool.security]
# Paths to exclude from secret scanning (TruffleHog, GitGuardian, Gitleaks)
# Run: we security generate (via wrknv) to regenerate tool configs
description = "Documentation with example credentials - intentionally committed"
allowed_paths = [
    # Documentation with example API keys and config patterns
    "docs/**",
    # Markdown files with examples
    "*.md",
    # Old gitleaks report
    "gitleaks-report.json",
    # Config file with examples
    "pyvider.toml",
]

# No `[tool.uv.sources]`. Local sibling checkouts are installed with
# `uv pip install -e ../pyvider-cty` rather than pinned as a path source here,
# so this file describes only what a published install resolves -- the same
# thing pyvider-cty and tofusoup say, and for the same reason.
#
# It is not only a preference. The release workflow calls ci-tooling's
# `python-release.yml`, which has no `no-sources` input to pass (checked against
# v0.4.2, the newest tag), so a path source here fails the release outright:
# "Failed to generate package metadata for `provide-foundation @ ../provide-foundation`".
# That is exactly how tofusoup's first v0.5.0 attempt died.
