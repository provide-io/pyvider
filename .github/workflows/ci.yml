# CI workflow for Python projects
# Uses wrknv tasks for consistency between local and CI environments.
name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      WRKNV_TASK_RUNNER: uv run
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Reset project environment
        run: |
          if [ -d .venv ]; then
            mv .venv ".venv.pre-act.$(date +%s)"
          fi

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: Check formatting
        run: .venv/bin/we run format.check

      - name: Run lint
        run: .venv/bin/we run lint

      - name: Run typecheck
        run: .venv/bin/we run typecheck

      - name: Run tests
        run: .venv/bin/we run test

      - name: Build package
        run: .venv/bin/we run build

      - name: Run security scan
        run: .venv/bin/we run security

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
