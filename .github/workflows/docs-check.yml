name: 📚 Documentation Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # The pull_request filter already watches this file. Without it here too,
      # a change to the workflow is verified on the branch and then never re-run
      # on main -- which is how a deploy step that failed on every push to main
      # stayed broken while every pull request went green.
      - '.github/workflows/docs-check.yml'

# Nothing here writes to the repository: this workflow checks the docs, it does
# not publish them. Declared explicitly so a job that starts needing write has
# to say so rather than inheriting it.
permissions:
  contents: read

jobs:
  check-docs:
    name: Check Documentation
    runs-on: ubuntu-24.04

    steps:
      # Check out the repository under test.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Install the Python the docs toolchain runs on.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      # Install uv, used to install the docs dependencies.
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      # Install MkDocs, its plugins, and provide-foundry from PyPI -- the same
      # published release the pyvider.com site builds these docs with.
      - name: Install dependencies
        run: |
          uv pip install --system mkdocs mkdocs-material mkdocstrings[python] pymdown-extensions
          uv pip install --system "provide-foundry>=0.4.1"

      # Extract the shared base config, theme, and hooks into .provide/foundry.
      - name: Setup foundry documentation assets
        run: |
          python -c "from provide.foundry.config import extract_base_mkdocs; from pathlib import Path; extract_base_mkdocs(Path('.'))"

      # Check internal links and heading anchors across docs/.
      - name: Check for broken links
        run: |
          python scripts/check_doc_links.py

      # Build in strict mode so a link MkDocs cannot resolve fails the check
      # here instead of surfacing later when the site builds these docs.
      - name: Build documentation
        run: |
          mkdocs build --strict

      # Advisory markdown lint; does not fail the job.
      - name: Check markdown formatting
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: docs
          config_file: .markdownlint.json
          ignore_files: docs/api
        continue-on-error: true
