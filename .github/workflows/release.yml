name: 🚀 Release

# Release is driven by a user-created GitHub Release. A manual dispatch is a
# dry run: it builds, tests and generates the SBOM, and every job that
# publishes anywhere is gated on the release event, so dispatching from a
# branch cannot reach TestPyPI or PyPI. (It could once -- the publish jobs had
# no event guard, and only the version-verify step failing on a non-tag ref
# kept PyPI out of reach.)
# Tag-push auto-release is deliberately not wired up yet — flip when ready.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Repair an existing release: re-attach and sign the artifacts PyPI holds for this tag (e.g. v0.6.1). Leave blank for a dry run.'
        required: false
        default: ''
        type: string

jobs:
  # Delegate tests + build + (optional) GH release to the ci-tooling reusable.
  # GH release creation is suppressed because `release: published` means one already exists.
  release:
    uses: provide-io/ci-tooling/.github/workflows/python-release.yml@v0.4.3
    # Skipped for a repair dispatch: that path attaches the artifacts PyPI
    # already holds, so building a fresh set here would only be discarded.
    if: github.event_name == 'release' || inputs.release_tag == ''
    permissions:
      contents: write
    with:
      create-github-release: false
    secrets: inherit

  # TestPyPI publish runs in the caller so PyPI Trusted Publishing matches the
  # OIDC job_workflow_ref against this repo's release.yml (reusable workflows
  # are not matched by PyPI's publisher config).
  publish-testpypi:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyvider
    steps:
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: 📤 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Install from TestPyPI and assert the installed version matches the release tag.
  # Uses the helper scripts from ci-tooling/scripts/release/.
  verify-testpypi:
    needs: publish-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout ci-tooling helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: provide-io/ci-tooling
          ref: v0.4.3
          path: .ci-tooling
      - name: 🐍 Setup Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: 🔖 Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .ci-tooling/scripts/release/resolve-tag-version.sh >> "$GITHUB_OUTPUT"
      - name: ✅ Install from TestPyPI and verify
        run: |
          .ci-tooling/scripts/release/verify-testpypi.sh pyvider "${{ steps.ver.outputs.version }}" "import pyvider; v = pyvider.__version__"

  # PyPI publish via trusted publisher bound to this repo's release.yml + env `pypi`.
  publish-pypi:
    needs: verify-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/pyvider
    steps:
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          skip-existing: true

  # SBOM for the built wheel and its dependencies. Its own job, with a
  # read-only token and no OIDC, because it installs the wheel's dependency
  # closure and the (pinned) cyclonedx-bom from PyPI and runs them: that must
  # not happen in the job that holds the sigstore signing identity and a
  # writable repository token, as it did before this job existed. Not gated
  # on the release event, so a dispatch dry run exercises it.
  sbom:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Only the script is needed from the checkout; no token is left behind.
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.11"
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      # Describes the built wheel and its dependencies, installed into a fresh
      # venv. `uvx cyclonedx-py environment` on its own described the uvx tool
      # venv -- cyclonedx-bom and friends, not this package.
      - name: 🧾 Generate Python SBOM
        run: scripts/sbom_from_wheel.sh dist sbom-python.cdx.json
      - name: ⬆️ Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sbom
          path: sbom-python.cdx.json
          if-no-files-found: error

  # Sign artifacts and attach everything, SBOM included, to the GH release.
  # No checkout and no package installs here: this job runs nothing but the
  # pinned actions and `gh`, so nothing fetched from a registry executes next
  # to the signing identity.
  sign-and-upload:
    needs: [publish-pypi, sbom]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: 📦 Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
      # Pinned at v3.5.0 deliberately. The previous v3.0.0 pin installed
      # sigstore-python 3.x, whose bundled TUF root can no longer verify
      # Sigstore's production root -- signing aborted with
      # "root was signed by 0/3 keys". v3.1.0 moved the action to
      # sigstore-python 4.x; do not pin back below it. The bundle format is
      # unchanged: rekor-version still defaults to 1 in the action's 3.x line.
      - name: 🔏 Sigstore sign artifacts
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - name: ⬆️ Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.sigstore.json sbom-python.cdx.json --repo "$GITHUB_REPOSITORY" --clobber

  # Repair path for a release whose sign-and-upload failed, leaving the GitHub
  # release without the artifacts that reached PyPI.
  #
  # The artifacts come from PyPI, not from a rebuild. A `release` event runs the
  # workflow frozen at its tag, so a release broken by a workflow bug cannot be
  # re-run into success; and rebuilding from today's tree produces bytes that
  # were never published under that version, which is worse than attaching
  # nothing. The script verifies each file against PyPI's own sha256 before it
  # is written.
  #
  # The signature is made now, by this workflow. It attests that these bytes are
  # the ones PyPI holds -- not that they were signed at release time. PyPI's
  # Trusted Publishing attestation remains the release-time provenance record.
  #
  # No SBOM is produced here on purpose: its dependency closure would be today's
  # resolution rather than the release's, and an SBOM that is confidently wrong
  # about what shipped is the failure this ecosystem has already had once.
  repair-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      # Only the fetch script is needed; no token is left behind.
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: 📦 Fetch the published artifacts from PyPI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/fetch_pypi_artifacts.py pyvider "$RELEASE_TAG" dist
      # Pinned at v3.5.0 deliberately. The previous v3.0.0 pin installed
      # sigstore-python 3.x, whose bundled TUF root can no longer verify
      # Sigstore's production root -- signing aborted with
      # "root was signed by 0/3 keys". v3.1.0 moved the action to
      # sigstore-python 4.x; do not pin back below it. The bundle format is
      # unchanged: rekor-version still defaults to 1 in the action's 3.x line.
      - name: 🔏 Sigstore sign artifacts
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - name: ⬆️ Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
